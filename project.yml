name: MeetingTranscriber
options:
  bundleIdPrefix: com.czlonkowski
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Stable signing identity so macOS privacy grants (Screen & System Audio
    # Recording, Automation, Microphone) and Keychain access survive rebuilds;
    # ad-hoc signing ("-") changed the identity on every build and silently
    # dropped system audio after each reinstall. No provisioning profile needed:
    # none of the entitlements are restricted.
    DEVELOPMENT_TEAM: GQ8R9NH7SP
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MeetingTranscriber/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: MeetingTranscriber/Resources/MeetingTranscriber.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.czlonkowski.MeetingTranscriber
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Developer ID Application"
    Release:
      DEVELOPMENT_TEAM: GQ8R9NH7SP
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.17.4"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.4"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    revision: 901941965d82e4a216d4d117231d847d194c563d
  GigaAM:
    url: https://github.com/kruatech/gigaam-v3-mlx
    revision: 95bd42a4b9a65450a24e1898c7d84b85e0e88509
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.6"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.8.1"
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.0"
targets:
  MeetingTranscriber:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_NAME: MeetX
        SWIFT_MODULE_NAME: MeetingTranscriber
    sources:
      - path: MeetingTranscriber
    resources:
      - path: MeetingTranscriber/Resources/meeting-patterns.json
      - path: MeetingTranscriber/Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift-lm
        product: MLXVLM
      - package: GigaAM
        product: GigaAMKit
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-sdk
        product: MCP
    info:
      path: MeetingTranscriber/Resources/Info.plist
      properties:
        CFBundleName: MeetX
        CFBundleDisplayName: MeetX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Romuald Członkowski"
        NSMicrophoneUsageDescription: "MeetX records your microphone while you record a meeting."
        NSAppleEventsUsageDescription: "MeetX asks Arc, Safari, and Chrome for the current tab URL to detect meetings you join."
        NSDesktopFolderUsageDescription: "Needed only if you import files from the Desktop."
        NSDocumentsFolderUsageDescription: "MeetX saves transcripts to your Documents folder."
        NSDownloadsFolderUsageDescription: "MeetX saves mixed audio to and imports media from your Downloads folder."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        LSUIElement: false
  MeetingTranscriberTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MeetingTranscriberTests
    dependencies:
      - target: MeetingTranscriber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.czlonkowski.MeetingTranscriberTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""
        BUNDLE_LOADER: "$(BUILT_PRODUCTS_DIR)/MeetX.app/Contents/MacOS/MeetX"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MeetX.app/Contents/MacOS/MeetX"
schemes:
  MeetingTranscriber:
    build:
      targets:
        MeetingTranscriber: all
        MeetingTranscriberTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeetingTranscriberTests
